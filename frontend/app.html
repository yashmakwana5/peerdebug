<!DOCTYPE html>
<html>
<head>
  <title>PeerDebug</title>
  
  <script src="/socket.io/socket.io.js"></script>
  <script defer src="app.js"></script>

  <style>
/* ===== GLOBAL RESET ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Inter", "Segoe UI", sans-serif;
  font-size: 18px;
}

/* ===== ANIMATED BACKGROUND ===== */
body {
  min-height: 100vh;
  background: linear-gradient(120deg,#0f2027,#203a43,#2c5364);
  background-size: 300% 300%;
  animation: bgMove 10s ease infinite;
  color: #e5e7eb;
  display: flex;
  justify-content: center;
}

@keyframes bgMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ===== CONTAINER ===== */
.container {
  width: 850px;
  padding: 40px 0;
}

/* ===== APP TITLE ===== */
h1 {
  font-size: 34px;
  margin-bottom: 30px;
  letter-spacing: 1px;
}

/* ===== GLASS CARD ===== */
.card {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(18px);
  border-radius: 18px;
  padding: 25px;
  margin-bottom: 25px;
  box-shadow:
    0 20px 40px rgba(0,0,0,0.25),
    inset 0 1px 1px rgba(255,255,255,0.15);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card:hover {
  transform: translateY(-6px) scale(1.01);
  box-shadow:
    0 30px 60px rgba(0,0,0,0.35),
    inset 0 1px 1px rgba(255,255,255,0.2);
}

.card h3 {
  margin-bottom: 15px;
}

/* ===== INPUTS ===== */
input {
  background: rgba(255,255,255,0.92);
  border: none;
  padding: 12px 14px;
  border-radius: 10px;
  margin-right: 10px;
  width: 220px;
  font-size: 18px;
  outline: none;
}

input::placeholder {
  color: #4b5563;
}

/* ===== BUTTONS ===== */
button {
  padding: 11px 20px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, #4f8cff, #6d7cff);
  color: #020617;
  cursor: pointer;
  font-weight: 700;
  box-shadow: 0 10px 25px rgba(79,140,255,0.4);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 18px 40px rgba(79,140,255,0.55);
}

/* ===== CHAT MESSAGES ===== */
#messages div {
  background: rgba(255,255,255,0.08);
  padding: 10px 12px;
  margin: 8px 0;
  border-radius: 10px;
  color: #ffffff;
}

.join,
.leave {
  text-align: center;
  font-style: italic;
  color: #ffffff;
}

/* ===== ONLINE USERS ===== */
#users div {
  background: rgba(255,255,255,0.12);
  padding: 8px;
  margin: 6px 0;
  border-radius: 8px;
  color: #ffffff;
}

/* ===== EMPTY STATE ===== */
.empty-state {
  text-align: center;
  padding: 18px;
  opacity: 0.65;
  font-size: 16px;
  font-style: italic;
  color: #e5e7eb;
}
/* ===== Chat & Online Users Text Black ===== */

#messages div,
#users div {
  color: #000000;   /* pure black */
  font-weight: 600;
}

.join,
.leave {
  color: #000000;
}

  </style>
</head>

<body>
  <div class="container">

    <h1>PeerDebug</h1>

    <!-- JOIN ROOM -->
    <div class="card">
      <h3>Join Room</h3>
      <input id="nameInput" placeholder="Your name">
      <input id="roomInput" placeholder="Room name">
      <button id="joinBtn">Join</button>
    </div>

    <!-- CHAT -->
    <div class="card">
      <h3>Chat</h3>

      <input id="messageInput" placeholder="Type message">
      <button id="sendBtn">Send</button>

      <br><br>

      <button id="startDebugBtn" style="display:none;">
        🔧 Start Debug
      </button>

      <div id="messages" style="margin-top:15px;">
        <div id="emptyChat" class="empty-state">
          
        </div>
      </div>
    </div>

    <!-- ONLINE USERS BELOW CHAT -->
    <div class="card">
      <h3>Online Users</h3>
      <div id="users">
        <div id="emptyUsers" class="empty-state">
          👤 No users online
        </div>
      </div>
    </div>

  </div>
</body>
</html>
